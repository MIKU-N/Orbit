<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Orbit · 星轨</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #060b19;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html[data-boot-theme='light'],
      html[data-boot-theme='light'] body {
        background: #eef2ff;
        color: #0f172a;
      }
      #orbit-preboot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 38%, rgba(99, 102, 241, 0.16), transparent 58%), #060b19;
      }
      html[data-boot-theme='light'] #orbit-preboot {
        background: radial-gradient(circle at 50% 38%, rgba(99, 102, 241, 0.14), transparent 58%), #eef2ff;
      }
      @keyframes prebootSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes prebootSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes prebootSweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      .preboot-orb {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preboot-ring-1 {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1.5px solid rgba(129, 140, 248, 0.22);
        border-top-color: #818cf8;
        animation: prebootSpin 2.4s linear infinite;
      }
      .preboot-ring-2 {
        position: absolute;
        inset: 9px;
        border-radius: 9999px;
        border: 1.5px solid rgba(56, 189, 248, 0.18);
        border-bottom-color: #38bdf8;
        animation: prebootSpinRev 1.8s linear infinite;
      }
      .preboot-logo {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.32);
      }
      .preboot-track {
        width: 128px;
        height: 3px;
        border-radius: 9999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.2);
      }
      .preboot-bar {
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #6366f1, #38bdf8, transparent);
        animation: prebootSweep 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .preboot-ring-1,
        .preboot-ring-2,
        .preboot-bar {
          animation: none !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('orbit_last_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.bootTheme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 p-0 overflow-x-hidden">
    <div id="root">
      <div id="orbit-preboot" aria-label="正在加载 Orbit">
        <div class="preboot-orb">
          <div class="preboot-ring-1"></div>
          <div class="preboot-ring-2"></div>
          <img class="preboot-logo" src="/apple-touch-icon.png" alt="Orbit" />
        </div>
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.88;">
          Orbit · 星轨
        </div>
        <div class="preboot-track"><div class="preboot-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
